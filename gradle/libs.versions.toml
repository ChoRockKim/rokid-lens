[versions]
agp = "9.2.1"
kotlin = "2.4.0"
activity = "1.13.0"
camerax = "1.4.2"
core = "1.18.0"
coroutines = "1.11.0"
desugar = "2.1.5"
junit = "4.13.2"
lifecycle = "2.10.0"
mlkit-languageid = "17.0.6"
mlkit-text = "16.0.1"
mlkit-translate = "17.0.3"
nanojson = "e9d656ddb49a412a5a0a5d5ef20ca7ef09549996"
okhttp = "5.4.0"
paparazzi = "2.0.0-alpha05.1"

[libraries]
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
mlkit-languageid = { module = "com.google.mlkit:language-id", version.ref = "mlkit-languageid" }
mlkit-text-latin = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text" }
mlkit-text-korean = { module = "com.google.mlkit:text-recognition-korean", version.ref = "mlkit-text" }
mlkit-text-japanese = { module = "com.google.mlkit:text-recognition-japanese", version.ref = "mlkit-text" }
mlkit-text-chinese = { module = "com.google.mlkit:text-recognition-chinese", version.ref = "mlkit-text" }
mlkit-text-devanagari = { module = "com.google.mlkit:text-recognition-devanagari", version.ref = "mlkit-text" }
mlkit-translate = { module = "com.google.mlkit:translate", version.ref = "mlkit-translate" }
nanojson = { module = "com.github.TeamNewPipe:nanojson", version.ref = "nanojson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
